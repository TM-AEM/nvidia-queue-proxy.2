name: Test and Deploy NVIDIA Queue Proxy

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvidia-queue-proxy-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    # Production deployment is restricted to the canonical `main` ref. A
    # `workflow_dispatch` run can be started from any branch, so this guard
    # prevents a manually dispatched run on a non-main branch from deploying
    # that branch's source to the production Worker.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Assert canonical main ref
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Refusing to deploy from ${{ github.ref }}; production deploy is restricted to refs/heads/main."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Canonical deployment guard
        run: npm run check:canonical

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run unit and workerd runtime tests
        run: npm test

      - name: Validate deployment bundle
        run: npm run deploy:dry-run

      - name: Check required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"
            exit 1
          fi

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Record deployed commit
        if: always()
        run: |
          echo "Triggering ref: ${{ github.ref }}"
          echo "Deployed commit SHA (checked out): $(git rev-parse HEAD)"
          echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
