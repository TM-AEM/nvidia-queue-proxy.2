name: Test and Deploy NVIDIA Queue Proxy

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvidia-queue-proxy-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run unit and workerd runtime tests
        run: npm test

      - name: Validate deployment bundle
        run: npm run deploy:dry-run

      - name: Check required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"
            exit 1
          fi

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Post-deployment health & readiness smoke test
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "WORKER_URL secret not set; skipping live smoke test."
            exit 0
          fi

          echo "Starting smoke check on $WORKER_URL..."
          # Test /health (liveness)
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$WORKER_URL/health" || echo "failed")
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "::error::Liveness probe /health failed with HTTP $HEALTH_STATUS"
            exit 1
          fi
          echo "Liveness check /health passed (HTTP 200)."

          # Test /ready (readiness)
          READY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$WORKER_URL/ready" || echo "failed")
          if [ "$READY_STATUS" != "200" ]; then
            echo "::error::Readiness probe /ready failed with HTTP $READY_STATUS"
            exit 1
          fi
          echo "Readiness check /ready passed (HTTP 200)."
