name: Production Smoke Test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Test and Deploy NVIDIA Queue Proxy"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Execute Production Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate WORKER_URL secret
        id: validate_url
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          node scripts/validate-worker-url.js
          echo "WORKER_URL validated successfully: authorized https workers.dev domain."

      - name: "Check A — Health Probe (GET /health)"
        env:
          TARGET_URL: ${{ steps.validate_url.outputs.target_url }}
        run: |
          TMP_DIR=$(mktemp -d) || { echo "::error::Failed to create temporary directory"; exit 1; }
          trap 'rm -rf "${TMP_DIR:-}"' EXIT

          BODY_FILE="${TMP_DIR}/body.json"
          STATUS_FILE="${TMP_DIR}/status.txt"

          CURL_EXIT=0
          curl -s -S \
            --connect-timeout 5 \
            --max-time 10 \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            "${TARGET_URL}/health" > "$STATUS_FILE" || CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Transport error: curl failed with exit code $CURL_EXIT on /health"
            exit 1
          fi

          HTTP_CODE=$(cat "$STATUS_FILE")
          node scripts/smoke-http-validate.js health "$HTTP_CODE" "$BODY_FILE"
          echo "Check A passed: HTTP 200, valid payload with ok=true"

      - name: "Check B — Readiness Probe (GET /ready)"
        env:
          TARGET_URL: ${{ steps.validate_url.outputs.target_url }}
        run: |
          TMP_DIR=$(mktemp -d) || { echo "::error::Failed to create temporary directory"; exit 1; }
          trap 'rm -rf "${TMP_DIR:-}"' EXIT

          BODY_FILE="${TMP_DIR}/body.json"
          STATUS_FILE="${TMP_DIR}/status.txt"

          CURL_EXIT=0
          curl -s -S \
            --connect-timeout 5 \
            --max-time 10 \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            "${TARGET_URL}/ready" > "$STATUS_FILE" || CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Transport error: curl failed with exit code $CURL_EXIT on /ready"
            exit 1
          fi

          HTTP_CODE=$(cat "$STATUS_FILE")
          node scripts/smoke-http-validate.js ready "$HTTP_CODE" "$BODY_FILE"
          echo "Check B passed: HTTP 200, all checks ready (proxy_key, upstream_key, rate_gate)"

      - name: "Check C — Unauthenticated Route Security (GET /v1/models)"
        env:
          TARGET_URL: ${{ steps.validate_url.outputs.target_url }}
        run: |
          TMP_DIR=$(mktemp -d) || { echo "::error::Failed to create temporary directory"; exit 1; }
          trap 'rm -rf "${TMP_DIR:-}"' EXIT

          STATUS_FILE="${TMP_DIR}/status.txt"

          CURL_EXIT=0
          curl -s -S \
            --connect-timeout 5 \
            --max-time 10 \
            -o /dev/null \
            -w "%{http_code}" \
            "${TARGET_URL}/v1/models" > "$STATUS_FILE" || CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Transport error: curl failed with exit code $CURL_EXIT on unauthenticated /v1/models"
            exit 1
          fi

          HTTP_CODE=$(cat "$STATUS_FILE")
          node scripts/smoke-http-validate.js unauth-models "$HTTP_CODE"
          echo "Check C passed: received expected HTTP 401 Unauthorized"

      - name: "Check D — Authenticated Unsupported Route (GET /v1/models)"
        env:
          TARGET_URL: ${{ steps.validate_url.outputs.target_url }}
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
        run: |
          if [ -z "$PROXY_KEY" ]; then
            echo "Optional PROXY_KEY secret not set; skipping Check D."
            exit 0
          fi

          TMP_DIR=$(mktemp -d) || { echo "::error::Failed to create temporary directory"; exit 1; }
          trap 'rm -rf "${TMP_DIR:-}"' EXIT

          STATUS_FILE="${TMP_DIR}/status.txt"

          CURL_EXIT=0
          curl -s -S \
            --connect-timeout 5 \
            --max-time 10 \
            -o /dev/null \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${PROXY_KEY}" \
            "${TARGET_URL}/v1/models" > "$STATUS_FILE" || CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Transport error: curl failed with exit code $CURL_EXIT on authenticated /v1/models"
            exit 1
          fi

          HTTP_CODE=$(cat "$STATUS_FILE")
          node scripts/smoke-http-validate.js auth-models "$HTTP_CODE"
          echo "Check D passed: received expected HTTP 404 Not Found"
