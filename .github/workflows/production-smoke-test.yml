name: Production Smoke Test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Test and Deploy NVIDIA Queue Proxy"]
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: production-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Execute Production Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Validate WORKER_URL secret
        id: validate_url
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::Missing required secret WORKER_URL"
            echo "Please set the WORKER_URL repository secret under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          CLEAN_URL=$(node -e '
            const raw = process.env.WORKER_URL || "";
            if (!raw || typeof raw !== "string") {
              console.error("::error::Missing required secret WORKER_URL");
              process.exit(1);
            }
            let u;
            try {
              u = new URL(raw);
            } catch {
              console.error("::error::WORKER_URL is malformed");
              process.exit(1);
            }
            if (u.protocol !== "https:") {
              console.error("::error::WORKER_URL must use https protocol");
              process.exit(1);
            }
            if (u.hostname !== "nvidia-queue-proxy-2.5s5k7kk.workers.dev") {
              console.error("::error::WORKER_URL hostname is not authorized");
              process.exit(1);
            }
            // Check for explicit ports (including default 443)
            const hostPart = raw.replace(/^https:\/\//, "").split("/")[0].split("?")[0].split("#")[0];
            if (hostPart.includes(":") || u.port !== "") {
              console.error("::error::WORKER_URL must not specify an explicit port");
              process.exit(1);
            }
            if (u.username !== "" || u.password !== "") {
              console.error("::error::WORKER_URL must not contain credentials");
              process.exit(1);
            }
            if (u.pathname !== "" && u.pathname !== "/") {
              console.error("::error::WORKER_URL must not contain a path component");
              process.exit(1);
            }
            if (u.search !== "") {
              console.error("::error::WORKER_URL must not contain a query string");
              process.exit(1);
            }
            if (u.hash !== "") {
              console.error("::error::WORKER_URL must not contain a fragment");
              process.exit(1);
            }
            console.log(u.origin);
          ')

          if [ -z "$CLEAN_URL" ]; then
            exit 1
          fi

          echo "target_url=${CLEAN_URL}" >> "$GITHUB_OUTPUT"
          echo "WORKER_URL validated successfully: authorized https workers.dev domain."

      - name: "Check A — Health Probe (GET /health)"
        env:
          TARGET_URL: ${{ steps.validate_url.outputs.target_url }}
        run: |
          BODY_FILE=$(mktemp)
          STATUS_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE" "$STATUS_FILE"' EXIT

          CURL_EXIT=0
          curl -s -S \
            --connect-timeout 5 \
            --max-time 10 \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            "${TARGET_URL}/health" > "$STATUS_FILE" || CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Transport error: curl failed with exit code $CURL_EXIT on /health"
            exit 1
          fi

          HTTP_CODE=$(cat "$STATUS_FILE")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health probe failed: expected HTTP 200, received HTTP $HTTP_CODE"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            try {
              const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (data.ok === true) process.exit(0);
              console.error("::error::Health check failed: expected payload {ok: true}");
              process.exit(1);
            } catch {
              console.error("::error::Health check failed: response was not valid JSON");
              process.exit(1);
            }
          ' "$BODY_FILE"

          echo "Check A passed: HTTP 200, valid payload with ok=true"

      - name: "Check B — Readiness Probe (GET /ready)"
        env:
          TARGET_URL: ${{ steps.validate_url.outputs.target_url }}
        run: |
          BODY_FILE=$(mktemp)
          STATUS_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE" "$STATUS_FILE"' EXIT

          CURL_EXIT=0
          curl -s -S \
            --connect-timeout 5 \
            --max-time 10 \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            "${TARGET_URL}/ready" > "$STATUS_FILE" || CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Transport error: curl failed with exit code $CURL_EXIT on /ready"
            exit 1
          fi

          HTTP_CODE=$(cat "$STATUS_FILE")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Readiness probe failed: expected HTTP 200, received HTTP $HTTP_CODE"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            try {
              const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const checks = data.checks || {};
              if (data.ready === true &&
                  checks.proxy_key === true &&
                  checks.upstream_key === true &&
                  checks.rate_gate === true) {
                process.exit(0);
              }
              console.error("::error::Readiness check failed: one or more required bindings are not ready");
              process.exit(1);
            } catch {
              console.error("::error::Readiness check failed: response was not valid JSON");
              process.exit(1);
            }
          ' "$BODY_FILE"

          echo "Check B passed: HTTP 200, all checks ready (proxy_key, upstream_key, rate_gate)"

      - name: "Check C — Unauthenticated Route Security (GET /v1/models)"
        env:
          TARGET_URL: ${{ steps.validate_url.outputs.target_url }}
        run: |
          STATUS_FILE=$(mktemp)
          trap 'rm -f "$STATUS_FILE"' EXIT

          CURL_EXIT=0
          curl -s -S \
            --connect-timeout 5 \
            --max-time 10 \
            -o /dev/null \
            -w "%{http_code}" \
            "${TARGET_URL}/v1/models" > "$STATUS_FILE" || CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Transport error: curl failed with exit code $CURL_EXIT on unauthenticated /v1/models"
            exit 1
          fi

          HTTP_CODE=$(cat "$STATUS_FILE")
          if [ "$HTTP_CODE" != "401" ]; then
            echo "::error::Security check failed: expected HTTP 401 Unauthorized for unauthenticated request, received HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Check C passed: received expected HTTP 401 Unauthorized"

      - name: "Check D — Authenticated Unsupported Route (GET /v1/models)"
        env:
          TARGET_URL: ${{ steps.validate_url.outputs.target_url }}
          PROXY_KEY: ${{ secrets.PROXY_KEY }}
        run: |
          if [ -z "$PROXY_KEY" ]; then
            echo "Optional PROXY_KEY secret not set; skipping Check D."
            exit 0
          fi

          STATUS_FILE=$(mktemp)
          trap 'rm -f "$STATUS_FILE"' EXIT

          CURL_EXIT=0
          curl -s -S \
            --connect-timeout 5 \
            --max-time 10 \
            -o /dev/null \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${PROXY_KEY}" \
            "${TARGET_URL}/v1/models" > "$STATUS_FILE" || CURL_EXIT=$?

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Transport error: curl failed with exit code $CURL_EXIT on authenticated /v1/models"
            exit 1
          fi

          HTTP_CODE=$(cat "$STATUS_FILE")
          if [ "$HTTP_CODE" != "404" ]; then
            echo "::error::Unsupported route check failed: expected HTTP 404 Not Found, received HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Check D passed: received expected HTTP 404 Not Found"
